[pytest]
minversion = 8.0
pythonpath = .
testpaths = steps
bdd_features_base_dir = features
markers =
    ui: browser UI tests
    api: HTTP API tests
    visual: screenshot comparison tests
    smoke: quick checks run first
log_file = reports/logs/main.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_mode = w
addopts =
    -ra
    -p no:allure_pytest
    --strict-markers
    --alluredir=reports/allure-results
    --output=reports/playwright
    --tracing=retain-on-failure
    --video=retain-on-failure
    --reruns=1
    --reruns-delay=1
    --only-rerun=playwright\._impl\._errors\.TimeoutError
    --only-rerun=requests\.exceptions\.(ConnectionError|Timeout|ReadTimeout|ConnectTimeout)
    --only-rerun=net::ERR_
