[pytest]
# Self-tests for the framework code in core/ and tools/. Isolated from the main suite:
# run with `pytest -c tests_framework/pytest.ini` (no network, no Allure output; a few tests use a real
# Chromium on local HTML, so `playwright install chromium` is needed).
pythonpath = ..
testpaths = .
addopts = -ra --strict-markers -p no:allure_pytest -p pytester --output=../reports/self-tests
markers =
    auth: area name used by the plugin tests (the real framework registers areas from features/)
    cart: area name used by the plugin tests
    pay: area name used by the plugin tests
    order_history: area name used by the plugin tests
