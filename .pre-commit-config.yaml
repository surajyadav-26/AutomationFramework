repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: import-linter
        name: import rules
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: check-rules
        name: step and feature rules
        entry: python tools/check_rules.py
        language: system
        pass_filenames: false
        files: ^(steps|features)/
