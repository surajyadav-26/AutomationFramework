[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "reports", "baselines"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["core", "pages", "clients", "shared", "tools", "steps", "conftest.py"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["core", "tools"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff.lint.per-file-ignores]
# the mutant table is one line per mutant on purpose
"tools/mutation_check.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["steps"]
bdd_features_base_dir = "features"
markers = [
    "ui: browser UI tests",
    "api: HTTP API tests",
    "visual: screenshot comparison tests",
    "accessibility: axe-core accessibility scans",
    "smoke: quick checks run first",
]
log_file_level = "INFO"
log_file_format = "%(asctime)s [pid %(process)d] %(levelname)s %(name)s: %(message)s"
# Reruns (count and delay come from .env: RERUN_COUNT, RERUN_DELAY) apply only to infrastructure
# errors. pytest-rerunfailures matches --only-rerun against "ClassName: message" for every
# exception in the chain, with no module path. tests_framework/test_rerun_filter.py checks the
# patterns. Each list item is one command line argument (no shell splitting happens).
addopts = [
    "-ra",
    "-p", "no:allure_pytest",  # an old global allure-pytest clashes with allure-pytest-bdd
    "--strict-markers",
    "--alluredir=reports/allure-results",
    "--clean-alluredir",
    "--output=reports/playwright",
    "--only-rerun=^(TimeoutError|ConnectTimeout|ReadTimeout|Timeout|ConnectionError|ConnectionResetError|ReadTimeoutError|ConnectTimeoutError|NewConnectionError|ProtocolError):",
    "--only-rerun=net::ERR_",
]

# Architecture rules, checked by `lint-imports`: features -> steps -> pages/clients -> core.
[tool.importlinter]
root_packages = ["steps", "shared", "pages", "clients", "core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "steps -> shared -> pages/clients -> core"
type = "layers"
layers = ["steps", "shared", "pages | clients", "core"]

[[tool.importlinter.contracts]]
name = "steps.api never imports pages, shared or Playwright"
type = "forbidden"
source_modules = ["steps.api"]
forbidden_modules = ["pages", "shared", "playwright", "pytest_playwright"]

[[tool.importlinter.contracts]]
name = "browser suites and shared never import clients"
type = "forbidden"
source_modules = ["steps.ui", "steps.visual", "steps.accessibility", "shared"]
forbidden_modules = ["clients"]
