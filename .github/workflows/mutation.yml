name: mutation
# "Tests of the tests": breaks the framework code on purpose and checks the self-tests notice.
# Takes about ten minutes, so it runs weekly and on demand instead of on every push.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: python tools/mutation_check.py
