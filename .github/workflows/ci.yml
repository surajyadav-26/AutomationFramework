name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository. The report job asks for more (Pages) itself.
permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A Playwright trace records everything typed, including passwords, and the Allure report is
  # published. Traces are kept as private run artifacts instead (see playwright-output-* below).
  ATTACH_TRACE_AND_VIDEO: "false"

# Every job: check out, then ./.github/actions/setup (Python, pinned dependencies, browsers).
# Visual tests are not run here: their baselines are local to a developer machine (see README.md).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium  # a few self-tests use a real browser on local HTML
      - run: python tools/check_env.py
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: mypy
      - run: python tools/check_rules.py
      - run: pytest -c tests_framework/pytest.ini tests_framework -q --tb=short --cov --cov-fail-under=95
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock --no-deps --disable-pip

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          check-secrets: "true"
      - run: pytest steps/api -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: reports/allure-results
          if-no-files-found: ignore

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: api
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          check-secrets: "true"
      - run: pytest steps/ui -m smoke -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-smoke
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output-ui-smoke
          path: reports/playwright
          if-no-files-found: ignore

  ui-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ui-smoke
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          check-secrets: "true"
      - run: pytest steps/ui -q --tb=short -n 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-full
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output-ui-full
          path: reports/playwright
          if-no-files-found: ignore

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ui-full
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          check-secrets: "true"
      - run: pytest steps/accessibility -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-accessibility
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output-accessibility
          path: reports/playwright
          if-no-files-found: ignore

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ui-full
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
          check-secrets: "true"
      - run: pytest steps/ui steps/accessibility -q --tb=short -n 2 --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-cross-browser-${{ matrix.browser }}
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output-cross-browser-${{ matrix.browser }}
          path: reports/playwright
          if-no-files-found: ignore

  report:
    # Merges the results of every test job, keeps run history for trend graphs, publishes the report.
    if: always()
    needs: [api, ui-smoke, ui-full, accessibility, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: reports/allure-results
      - name: Check there is something to report
        id: has_results
        run: |
          if ls reports/allure-results/*-result.json >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Allure results were produced (earlier jobs failed or were skipped)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.has_results.outputs.found == 'true'
        with:
          python-version-file: .python-version
      - name: Job summary
        if: steps.has_results.outputs.found == 'true'
        run: python tools/ci_summary.py reports/allure-results >> "$GITHUB_STEP_SUMMARY"
      - name: Restore report history
        if: steps.has_results.outputs.found == 'true'
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-
      - name: Build the Allure report (with history)
        if: steps.has_results.outputs.found == 'true'
        run: |
          npm install -g allure-commandline
          if [ -d allure-history ]; then
            mkdir -p reports/allure-results/history
            cp -r allure-history/. reports/allure-results/history/
          fi
          allure generate reports/allure-results -o reports/allure-report --clean
          python -c "from pathlib import Path; from core.reporting.allure_report import apply_theme; apply_theme(Path('reports/allure-report'), 'dark')"
          rm -rf allure-history
          cp -r reports/allure-report/history allure-history
      - name: Save report history
        if: steps.has_results.outputs.found == 'true'
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
      - name: Keep the report as an artifact
        if: steps.has_results.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
      - name: Publish to GitHub Pages (main only)
        continue-on-error: true  # the repo setting Pages > Source > GitHub Actions may not be on yet
        if: steps.has_results.outputs.found == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure-report
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        if: steps.has_results.outputs.found == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
