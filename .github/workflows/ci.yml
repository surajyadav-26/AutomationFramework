name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock -r requirements-quality.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: mypy
      - run: python tools/check_rules.py
      - run: pytest -c tests_framework/pytest.ini tests_framework -q --tb=short --cov --cov-fail-under=95
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock -r requirements-quality.lock --no-deps --disable-pip

  api:
    runs-on: ubuntu-latest
    needs: lint
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/api -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: reports/allure-results
          if-no-files-found: ignore

  ui-smoke:
    runs-on: ubuntu-latest
    needs: api
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/ui -m smoke -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-smoke
          path: reports/allure-results
          if-no-files-found: ignore

  ui-full:
    runs-on: ubuntu-latest
    needs: ui-smoke
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/ui -q --tb=short -n 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-full
          path: reports/allure-results
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    needs: ui-full
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/visual -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-visual
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: reports/visual
          if-no-files-found: ignore

  accessibility:
    runs-on: ubuntu-latest
    needs: ui-full
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/accessibility -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-accessibility
          path: reports/allure-results
          if-no-files-found: ignore

  cross-browser:
    runs-on: ubuntu-latest
    needs: ui-full
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - name: Run the browser suites (visual joins once this browser has linux baselines)
        run: |
          paths="steps/ui steps/accessibility"
          if ls baselines/linux/${{ matrix.browser }}/*/*.png >/dev/null 2>&1; then
            paths="$paths steps/visual"
          fi
          pytest $paths -q --tb=short -n 2 --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-cross-browser-${{ matrix.browser }}
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs-${{ matrix.browser }}
          path: reports/visual
          if-no-files-found: ignore

  report:
    # Merges the results of every test job, keeps run history for trend graphs, publishes the report.
    if: always()
    needs: [api, ui-smoke, ui-full, visual, accessibility, cross-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: reports/allure-results
      - name: Check there is something to report
        id: has_results
        run: |
          if ls reports/allure-results/*-result.json >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Allure results were produced (earlier jobs failed or were skipped)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.has_results.outputs.found == 'true'
        with:
          python-version: "3.12"
      - name: Job summary
        if: steps.has_results.outputs.found == 'true'
        run: python tools/ci_summary.py reports/allure-results >> "$GITHUB_STEP_SUMMARY"
      - name: Restore report history
        if: steps.has_results.outputs.found == 'true'
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-
      - name: Build the Allure report (with history)
        if: steps.has_results.outputs.found == 'true'
        run: |
          npm install -g allure-commandline
          if [ -d allure-history ]; then
            mkdir -p reports/allure-results/history
            cp -r allure-history/. reports/allure-results/history/
          fi
          allure generate reports/allure-results -o reports/allure-report --clean
          python -c "from pathlib import Path; from core.reporting.allure_report import apply_theme; apply_theme(Path('reports/allure-report'), 'dark')"
          rm -rf allure-history
          cp -r reports/allure-report/history allure-history
      - name: Save report history
        if: steps.has_results.outputs.found == 'true'
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
      - name: Keep the report as an artifact
        if: steps.has_results.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
      - name: Publish to GitHub Pages (main only)
        continue-on-error: true  # the repo setting Pages > Source > GitHub Actions may not be on yet
        if: steps.has_results.outputs.found == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        if: steps.has_results.outputs.found == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
