name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: python tools/check_rules.py
      - run: pytest -c tests_framework/pytest.ini tests_framework -q --tb=short

  api:
    runs-on: ubuntu-latest
    needs: lint
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/api -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: reports/allure-results
          if-no-files-found: ignore

  ui-smoke:
    runs-on: ubuntu-latest
    needs: api
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/ui -m smoke -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-smoke
          path: reports/allure-results
          if-no-files-found: ignore

  ui-full:
    runs-on: ubuntu-latest
    needs: ui-smoke
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/ui -q --tb=short -n 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-full
          path: reports/allure-results
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    needs: ui-full
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/visual -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-visual
          path: reports/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: reports/visual
          if-no-files-found: ignore

  accessibility:
    runs-on: ubuntu-latest
    needs: ui-full
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/accessibility -q --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-accessibility
          path: reports/allure-results
          if-no-files-found: ignore

  cross-browser:
    runs-on: ubuntu-latest
    needs: ui-full
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/ui steps/accessibility -q --tb=short -n 2 --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-cross-browser-${{ matrix.browser }}
          path: reports/allure-results
          if-no-files-found: ignore
