name: update-baselines
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check required secrets
        run: |
          for name in APP_PASSWORD API_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions (see docs/CI_SETUP.md)."
              missing=1
            fi
          done
          exit ${missing:-0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: playwright install --with-deps chromium firefox webkit
      - run: pytest steps/visual --update-baselines --browser chromium --browser firefox --browser webkit -q --tb=short
      - uses: peter-evans/create-pull-request@v7
        with:
          add-paths: baselines/linux
          branch: update-linux-baselines
          commit-message: "chore: update linux visual baselines"
          title: "Update linux visual baselines"
          body: |
            Regenerated by the update-baselines workflow on ubuntu-latest.
            Review every changed image before merging; these are the visual source of truth.
